name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"

      - name: Install package + dev dependencies
        run: uv sync --locked --dev --extra decisions

      - name: Install runtime provider and Core session test modules
        # Installs the runtime dep from main. The previous feat-branch reference
        # broke when openai#32 (feat/m2-openai branch) was merged and its branch
        # deleted on 2026-05-08. Updated 2026-05-09 to install from main.
        #
        # If this step fails with a 404/auth error the repo is private — add a PAT
        # with repo-read scope as a secret named GH_PAT and use:
        #   git+https://${{ secrets.GH_PAT }}@github.com/...
        run: |
          uv pip install \
            "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai.git@main" \
            "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming.git@main" \
            "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple.git@main"

      - name: pytest (offline provider contracts)
        # Exercises inherited ordinary/continued responses, Azure cache/PTU policy,
        # canonical usage and decision configuration without live credentials.
        # Behavioral/structural validation still requires a real Azure deployment.
        run: >-
          uv run --no-sync pytest -v tests/test_llm_response_ordering.py
          tests/test_cache_boundaries.py tests/test_cost_callback_ordering.py tests/test_attempt_cost.py
          tests/test_decisions.py tests/test_decision_hook.py tests/test_unknown_config_keys.py
          tests/test_wait_policy.py tests/test_close.py tests/test_decision_mount_rollback.py
